services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finances
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: finances
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finances -d finances"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://finances:localdev@postgres:5432/finances?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata: