services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_finances
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finances
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d finances"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata: